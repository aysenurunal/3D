[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-to-print"
version = "0.1.0"
description = "A local pipeline for turning object photos into 3D-printable meshes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mesh = [
  "numpy>=1.26",
  "trimesh>=4.0",
]

[project.scripts]
photo-to-print = "photo_to_print.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
